services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ops
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    environment: &env
      DATABASE_URL: postgres://postgres:postgres@db:5432/ops
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
    depends_on:
      db: { condition: service_healthy }
    # Migrates, seeds demo data only if the DB is empty, then serves API + UI.
    command: sh -c "python -m app.migrate && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 3000"
    ports: ["3000:3000"]

  worker:
    build: .
    environment: *env
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    command: sh -c "sleep 5 && python -m app.worker"

volumes:
  pgdata:
